<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sky" cx="50%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#0f1a3a"/>
      <stop offset="55%" stop-color="#0a1228"/>
      <stop offset="100%" stop-color="#05070f"/>
    </radialGradient>
    <linearGradient id="milkyway" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cfd8f0" stop-opacity="0"/>
      <stop offset="45%" stop-color="#cfd8f0" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#e8ecfb" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#cfd8f0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="starGlowBig" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="25%" stop-color="#bcd4ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#bcd4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="720" fill="url(#sky)"/>
  <!-- Fascia della Via Lattea, allineata alla vera direzione Deneb-Sadr-Albireo-Altair -->
  <rect x="27.9" y="238.85" width="750" height="260" fill="url(#milkyway)" transform="rotate(73.4 402.9 368.85)"/>

  <!-- stelle di sfondo -->
  <g fill="#eaf0ff">
    <circle cx="70" cy="90" r="1.1" opacity="0.7"/>
    <circle cx="130" cy="220" r="1.4" opacity="0.8"/>
    <circle cx="180" cy="60" r="0.9" opacity="0.6"/>
    <circle cx="230" cy="380" r="1.2" opacity="0.7"/>
    <circle cx="90" cy="470" r="1.5" opacity="0.75"/>
    <circle cx="300" cy="140" r="1.0" opacity="0.6"/>
    <circle cx="360" cy="520" r="1.3" opacity="0.7"/>
    <circle cx="420" cy="90" r="1.1" opacity="0.65"/>
    <circle cx="470" cy="670" r="1.4" opacity="0.75"/>
    <circle cx="540" cy="180" r="1.0" opacity="0.6"/>
    <circle cx="600" cy="60" r="1.2" opacity="0.7"/>
    <circle cx="650" cy="450" r="1.5" opacity="0.8"/>
    <circle cx="720" cy="120" r="1.0" opacity="0.6"/>
    <circle cx="780" cy="580" r="1.3" opacity="0.7"/>
    <circle cx="830" cy="250" r="1.1" opacity="0.65"/>
    <circle cx="880" cy="90" r="1.4" opacity="0.75"/>
    <circle cx="920" cy="400" r="1.2" opacity="0.7"/>
    <circle cx="950" cy="560" r="1.0" opacity="0.6"/>
    <circle cx="40" cy="340" r="1.3" opacity="0.7"/>
    <circle cx="260" cy="640" r="1.1" opacity="0.65"/>
    <circle cx="180" cy="420" r="0.9" opacity="0.55"/>
    <circle cx="560" cy="500" r="1.1" opacity="0.6"/>
    <circle cx="150" cy="560" r="1.0" opacity="0.6"/>
    <circle cx="890" cy="480" r="1.1" opacity="0.65"/>
    <circle cx="620" cy="80" r="1.0" opacity="0.6"/>
    <circle cx="900" cy="620" r="0.8" opacity="0.5"/>
    <circle cx="200" cy="130" r="0.8" opacity="0.5"/>
  </g>

  <text x="500" y="52" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#f4f7ff" letter-spacing="1">Il Triangolo Estivo</text>
  <text x="500" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#8fa3d1" letter-spacing="3">VEGA · ALTAIR · DENEB</text>

  <!-- Triangolo principale, proporzioni reali: Vega-Deneb lato corto, Altair vertice dei due lati lunghi -->
  <g stroke="#ffe9a8" stroke-width="1.6" stroke-dasharray="2 7" stroke-linecap="round" opacity="0.85">
    <line x1="681.8" y1="215.2" x2="331.7" y2="130.0"/>
    <line x1="331.7" y1="130.0" x2="474.1" y2="607.7"/>
    <line x1="474.1" y1="607.7" x2="681.8" y2="215.2"/>
  </g>

  <!-- Lira: Vega, Sheliak, Sulafat (posizioni reali) -->
  <g stroke="#7ea8e8" stroke-width="1.3" opacity="0.75" fill="none">
    <polyline points="681.8,215.2 644.8,286.4 619.9,295.2 681.8,215.2"/>
  </g>
  <g fill="#dbe6ff">
    <circle cx="644.8" cy="286.4" r="2.4"/>
    <circle cx="619.9" cy="295.2" r="2.4"/>
  </g>

  <!-- Cigno (Croce del Nord): Deneb-Sadr-Albireo, Delta Cyg-Sadr-Gienah (posizioni reali) -->
  <g stroke="#7ea8e8" stroke-width="1.3" opacity="0.75" fill="none">
    <polyline points="331.7,130.0 385.7,195.9 530.5,357.2"/>
    <polyline points="490.4,132.0 385.7,195.9 318.2,278.4"/>
  </g>
  <g fill="#dbe6ff">
    <circle cx="385.7" cy="195.9" r="2.4"/>
    <circle cx="530.5" cy="357.2" r="2.6"/>
    <circle cx="490.4" cy="132.0" r="2.2"/>
    <circle cx="318.2" cy="278.4" r="2.2"/>
  </g>

  <!-- Aquila: Tarazed-Altair-Alshain (posizioni reali) -->
  <g stroke="#7ea8e8" stroke-width="1.3" opacity="0.75" fill="none">
    <polyline points="486.8,584.8 474.1,607.7 461.4,640.0"/>
  </g>
  <g fill="#dbe6ff">
    <circle cx="486.8" cy="584.8" r="2.3"/>
    <circle cx="461.4" cy="640.0" r="2.2"/>
  </g>

  <!-- Le tre stelle principali, con bagliore -->
  <g filter="url(#softGlow)">
    <circle cx="681.8" cy="215.2" r="26" fill="url(#starGlowBig)"/>
    <circle cx="331.7" cy="130.0" r="24" fill="url(#starGlowBig)"/>
    <circle cx="474.1" cy="607.7" r="22" fill="url(#starGlowBig)"/>
  </g>
  <circle cx="681.8" cy="215.2" r="6.5" fill="#ffffff"/>
  <circle cx="331.7" cy="130.0" r="6" fill="#ffffff"/>
  <circle cx="474.1" cy="607.7" r="5.5" fill="#fff6dd"/>

  <!-- Etichette -->
  <text x="740" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#ffffff">VEGA</text>
  <text x="740" y="255" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#9fb3de">α Lyrae · Lira</text>

  <text x="331.7" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#ffffff">DENEB</text>
  <text x="331.7" y="108" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#9fb3de">α Cygni · Cigno</text>

  <text x="585" y="595" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#ffffff">ALTAIR</text>
  <text x="585" y="618" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#9fb3de">α Aquilae · Aquila</text>

  <text x="500" y="695" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5d6d99" letter-spacing="0.5">Posizioni ricavate dalle coordinate equatoriali reali delle stelle (proiezione semplificata) · non in scala fotometrica</text>
</svg>
