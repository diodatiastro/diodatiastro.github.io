  <title
     id="mp-title">Massa e peso: cosa cambia e cosa resta uguale</title>
  <desc
     id="mp-desc">Confronto tra peso e massa dello stesso oggetto su Terra, sulla Luna e nello spazio profondo. Il peso, letto da una bilancia, scende da 98 N a 16 N a 0 N. La massa, misurata dalla resistenza a essere accelerato con la stessa spinta, resta 10 kg in tutti e tre i casi.</desc>
