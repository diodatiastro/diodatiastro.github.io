<svg width="100%" viewBox="0 0 680 360" role="img" style="" xmlns="http://www.w3.org/2000/svg">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Confronto tra modi p e modi g di pulsazione stellare</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Due sezioni schematiche di una stella affiancate. A sinistra, i modi p: l'inviluppo esterno è colorato e attraversato da fronti d'onda concentrici, mentre il nucleo resta grigio e inattivo, a indicare che le onde di pressione si propagano soprattutto negli strati esterni con periodi dell'ordine dei minuti. A destra, i modi g: il nucleo è colorato e percorso da sottili linee ondulate orizzontali che rappresentano l'oscillazione per galleggiamento negli strati stabilmente stratificati, mentre l'inviluppo esterno resta grigio, a indicare che le onde di gravità restano confinate nell'interno radiativo con periodi dell'ordine delle ore.</desc>
<defs>
<clipPath id="coreClipG"><circle r="35"/></clipPath>
</defs>

<text x="190" y="90" text-anchor="middle" style="fill:rgb(11, 11, 11);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:auto">Modi p (pressione)</text>
