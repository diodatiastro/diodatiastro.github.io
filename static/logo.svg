<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 400 400"
   width="400"
   height="400"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="space" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1a2744" />
      <stop offset="55%" stop-color="#0c1525" />
      <stop offset="100%" stop-color="#02050c" />
    </radialGradient>

    <radialGradient id="starBody" cx="40%" cy="36%" r="70%">
      <stop offset="0%"  stop-color="#ffffff" />
      <stop offset="16%" stop-color="#eaf6ff" />
      <stop offset="36%" stop-color="#bfe3fb" />
      <stop offset="60%" stop-color="#6fb8e8" />
      <stop offset="82%" stop-color="#2f6fa8" />
      <stop offset="100%" stop-color="#123a5e" />
    </radialGradient>

    <radialGradient id="limb" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#08182a" stop-opacity="0" />
      <stop offset="88%" stop-color="#08182a" stop-opacity="0" />
      <stop offset="100%" stop-color="#08182a" stop-opacity="0.5" />
    </radialGradient>

    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="52%" stop-color="#a9d8f5" stop-opacity="0" />
      <stop offset="78%" stop-color="#8fc9f0" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#6fb8e8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="hotspot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <filter id="granulation" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028 0.032" numOctaves="4" seed="11" result="noise" />
      <feColorMatrix in="noise" type="matrix"
        values="0.15 0.15 0.15 0 0
                0.35 0.35 0.35 0 0
                0.55 0.55 0.55 0 0
                0.45 0.45 0.45 0 0" result="tinted" />
      <feComposite in="tinted" in2="SourceGraphic" operator="in" />
    </filter>

    <filter id="blur-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" />
    </filter>

    <filter id="blur-lg" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="16" />
    </filter>

    <clipPath id="roundClip">
      <circle cx="200" cy="200" r="196" />
    </clipPath>

    <linearGradient id="spikeLong" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#eaf6ff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#eaf6ff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="spikeShort" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#dcefff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#dcefff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="spikeBright" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="28%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="58%" stop-color="#f2f9ff" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#eaf6ff" stop-opacity="0" />
    </linearGradient>

    <polygon id="spikeL" points="0,0 2.2,-22 0,-172 -2.2,-22" fill="url(#spikeLong)" />
    <polygon id="spikeS" points="0,0 1.6,-14 0,-98 -1.6,-14" fill="url(#spikeShort)" />
    <polygon id="spikeB" points="0,0 2.4,-16 0,-148 -2.4,-16" fill="url(#spikeBright)" />
  </defs>

  <g clip-path="url(#roundClip)">
    <circle cx="200" cy="200" r="200" fill="url(#space)" />

    <g opacity="0.85">
      <circle cx="55" cy="65" r="1.3" fill="#ffffff" />
      <circle cx="345" cy="52" r="1.1" fill="#cfe3ff" />
      <circle cx="42" cy="332" r="1.4" fill="#ffffff" />
      <circle cx="358" cy="298" r="1.2" fill="#ffe9c4" />
      <circle cx="85" cy="358" r="1" fill="#ffffff" />
      <circle cx="318" cy="365" r="1.1" fill="#cfe3ff" />
      <circle cx="205" cy="30" r="1" fill="#ffffff" />
      <circle cx="25" cy="205" r="1" fill="#ffffff" />
      <circle cx="372" cy="205" r="1" fill="#ffffff" />
    </g>

    <g filter="url(#blur-lg)" opacity="0.4">
      <path d="M 268 122 Q 330 92 338 145 Q 305 132 282 158 Z" fill="#bfe3fb" />
      <path d="M 122 288 Q 80 316 100 348 Q 122 316 145 316 Z" fill="#eaf6ff" />
    </g>

    <circle cx="200" cy="196" r="152" fill="url(#corona)" />

    <g transform="translate(200,196)" style="mix-blend-mode:screen">
      <use href="#spikeL" transform="rotate(0)" />
      <use href="#spikeL" transform="rotate(90)" />
      <use href="#spikeL" transform="rotate(180)" />
      <use href="#spikeL" transform="rotate(270)" />
      <use href="#spikeS" transform="rotate(45)" />
      <use href="#spikeS" transform="rotate(135)" />
      <use href="#spikeS" transform="rotate(225)" />
      <use href="#spikeS" transform="rotate(315)" />
      <use href="#spikeB" transform="rotate(24)" />
      <use href="#spikeB" transform="rotate(203)" />
      <use href="#spikeB" transform="rotate(312)" />
    </g>

    <circle cx="200" cy="196" r="128" fill="url(#starBody)" />

    <circle cx="200" cy="196" r="128" fill="#ffffff" filter="url(#granulation)" opacity="0.35" style="mix-blend-mode:overlay" />

    <circle cx="200" cy="196" r="128" fill="url(#limb)" style="mix-blend-mode:multiply" />

    <circle cx="164" cy="158" r="44" fill="url(#hotspot)" filter="url(#blur-soft)" opacity="0.8" />

    <circle cx="200" cy="196" r="16" fill="#ffffff" filter="url(#blur-soft)" opacity="0.9" />
  </g>

  <circle cx="200" cy="200" r="196" fill="none" stroke="#d7ecf8" stroke-width="6" opacity="0.9" />
  <circle cx="200" cy="200" r="184" fill="none" stroke="#e8f5fc" stroke-width="1.2" opacity="0.5" />
  <circle cx="200" cy="200" r="174" fill="none" stroke="#f5fbfe" stroke-width="0.6" opacity="0.3" />
</svg>
