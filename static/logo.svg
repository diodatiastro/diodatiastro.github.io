     id="desc1">Icona quadrata con sfondo rosa-magenta e verde smeraldo che richiama la Nebulosa di Orione, e le quattro stelle del Trapezio disposte secondo la loro reale struttura: un paio ravvicinato in alto a destra, una stella molto luminosa in basso al centro e una quarta stella più isolata a sinistra.</desc>
