     id="title1">Logo con le quattro stelle del Trapezio nella loro reale disposizione a gruppo compatto</title>
  <desc
     style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"
     id="desc1">Icona quadrata con sfondo rosa-magenta e verde smeraldo che richiama la Nebulosa di Orione, e le quattro stelle del Trapezio disposte secondo la loro reale struttura: un paio ravvicinato in alto a destra, una stella molto luminosa in basso al centro e una quarta stella più isolata a sinistra.</desc>
