<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Statistiche delle visite</title>
<style>
  :root { --bg:#0e1320; --panel:#161d2e; --line:#2a3550; --text:#f2ece0; --muted:#a8b0c2; --gold:#e8b04a; --blue:#8fb8e8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:960px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.8rem; color:var(--gold); margin:0 0 .3rem; }
  p.nota { color:var(--muted); margin:.2rem 0 1.2rem; }
  .riepilogo { display:flex; flex-wrap:wrap; gap:12px; margin:1rem 0 1.4rem; }
  .riepilogo div { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:.7rem 1rem; min-width:150px; }
  .riepilogo b { display:block; font-size:1.6rem; color:var(--gold); }
  .filtri { margin:0 0 1rem; display:flex; gap:8px; flex-wrap:wrap; }
  .filtri button { font:inherit; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:.35rem .8rem; cursor:pointer; }
  .filtri button.attivo { border-color:var(--gold); color:var(--gold); }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:.5rem .6rem; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:.95rem; }
  td.n { text-align:right; font-variant-numeric:tabular-nums; font-weight:600; width:5rem; }
  td a { color:var(--blue); text-decoration:none; }
  td a:hover { text-decoration:underline; }
  td small { color:var(--muted); display:block; }
  .zero td { color:var(--muted); }
  #stato { color:var(--muted); }
  .pagine { display:flex; align-items:center; justify-content:center; gap:14px; margin:1.2rem 0 0; color:var(--muted); }
  .pagine button { font:inherit; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:.35rem .9rem; cursor:pointer; }
  .pagine button:disabled { opacity:.35; cursor:default; }
</style>
</head>
<body>
<main>
  <h1>Statistiche delle visite</h1>
  <p class="nota">Una visita per pagina per sessione del browser, escluse le tue (#non-contarmi). Conteggio dal server Waline del sito, a partire dall'attivazione del contatore.</p>
  <div class="riepilogo">
    <div><b id="totale">…</b>visite in tutto</div>
    <div><b id="visitate">…</b>pagine con almeno una visita</div>
    <div><b id="pagine">…</b>pagine nel sito</div>
  </div>
  <div class="filtri" id="filtri"></div>
  <p id="stato">Caricamento…</p>
  <table hidden id="tabella">
    <thead><tr><th>Pagina</th><th style="text-align:right">Visite</th></tr></thead>
    <tbody id="righe"></tbody>
  </table>
  <div class="pagine" id="pagine-nav" hidden>
    <button type="button" id="prec">‹ Precedenti</button>
    <span id="pagina-n"></span>
    <button type="button" id="succ">Successive ›</button>
  </div>
</main>
<script>
(async function () {
  var SERVER = "https://diodatiastro-commenti.vercel.app/";
  var PER_PAGINA = 50;
  var stato = document.getElementById("stato");
  try {
    // elenco di percorsi e titoli generato da Hugo a ogni pubblicazione
    var elenco = await (await fetch("/statistiche/pagine.json", { cache: "no-store" })).json();
    var conteggi = {};
    for (var i = 0; i < elenco.length; i += 20) {
      var gruppo = elenco.slice(i, i + 20).map(function (x) { return x.path; });
      var r = await fetch(SERVER + "api/article?path=" + encodeURIComponent(gruppo.join(",")) + "&type=time&lang=it");
      var dati = (await r.json()).data || [];
      gruppo.forEach(function (p, j) { conteggi[p] = (dati[j] && dati[j].time) || 0; });
    }
    var righe = elenco.map(function (x) {
      var p = x.path;
      var sezione = p === "/" ? "home" : p.split("/")[1];
      if (/^\/stelle\/sgr-1806-20\//.test(p)) sezione = "saggio SGR 1806-20";
      return { p: p, titolo: x.title, n: conteggi[p] || 0, sezione: sezione };
    }).sort(function (a, b) { return b.n - a.n || a.p.localeCompare(b.p); });

    document.getElementById("totale").textContent = righe.reduce(function (s, x) { return s + x.n; }, 0);
    document.getElementById("visitate").textContent = righe.filter(function (x) { return x.n > 0; }).length;
    document.getElementById("pagine").textContent = righe.length;

    var tbody = document.getElementById("righe");
    var nav = document.getElementById("pagine-nav");
    var prec = document.getElementById("prec"), succ = document.getElementById("succ");
    var filtro = "tutte", pagina = 0;

    function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

    function mostra() {
      var scelte = righe.filter(function (x) { return filtro === "tutte" || x.sezione === filtro; });
      var tot = Math.max(1, Math.ceil(scelte.length / PER_PAGINA));
      if (pagina >= tot) pagina = tot - 1;
      tbody.innerHTML = scelte.slice(pagina * PER_PAGINA, (pagina + 1) * PER_PAGINA).map(function (x) {
        return '<tr' + (x.n ? '' : ' class="zero"') + '><td><a href="' + esc(x.p) + '">' + esc(x.p) + '</a><small>' + esc(x.titolo) + '</small></td><td class="n">' + x.n + '</td></tr>';
      }).join("");
      nav.hidden = tot < 2;
      document.getElementById("pagina-n").textContent = "pagina " + (pagina + 1) + " di " + tot;
      prec.disabled = pagina === 0;
      succ.disabled = pagina >= tot - 1;
    }
    prec.onclick = function () { pagina--; mostra(); window.scrollTo(0, 0); };
    succ.onclick = function () { pagina++; mostra(); window.scrollTo(0, 0); };

    var sezioni = ["tutte"].concat(Array.from(new Set(righe.map(function (x) { return x.sezione; }))));
    var filtri = document.getElementById("filtri");
    sezioni.forEach(function (s, k) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = s; if (!k) b.className = "attivo";
      b.onclick = function () {
        filtri.querySelectorAll("button").forEach(function (x) { x.className = ""; });
        b.className = "attivo"; filtro = s; pagina = 0; mostra();
      };
      filtri.appendChild(b);
    });

    mostra();
    stato.hidden = true;
    document.getElementById("tabella").hidden = false;
  } catch (e) {
    stato.textContent = "Errore nel caricamento dei dati: " + e.message;
  }
})();
</script>
</body>
</html>
