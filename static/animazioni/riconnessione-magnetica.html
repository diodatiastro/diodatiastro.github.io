<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riconnessione magnetica sopra una magnetar</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; padding:0; background:#05030b; }
  .rm-wrap {
    position: relative;
    width: 100%;
    max-width: 960px;
    margin: 0 auto;
    line-height: 0;
  }
  .rm-wrap canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 960 / 640;
    border-radius: 8px;
  }
  .rm-btn {
    position: absolute;
    top: 10px; right: 12px;
    font: 600 12px/1 "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    color: #e8e2ff;
    background: rgba(12,8,26,.55);
    border: 1px solid rgba(232,226,255,.35);
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
    letter-spacing: .02em;
    backdrop-filter: blur(3px);
    transition: background .15s, border-color .15s;
  }
  .rm-btn:hover { background: rgba(40,28,80,.75); border-color: rgba(232,226,255,.7); }
</style>
</head>
<body>
<div class="rm-wrap">
  <canvas id="rm-canvas" width="960" height="640" role="img"
    aria-label="Animazione schematica della riconnessione magnetica sopra la superficie di una magnetar: due fasci di linee di campo di polarità opposta vengono spinti l'uno contro l'altro in una sottile lamina di corrente; nel punto X le linee si tagliano e si ricuciono, e le nuove linee fortemente piegate si raddrizzano di scatto scagliando due getti di plasma in direzioni opposte, verso l'alto e verso la crosta della stella, mentre dal punto di taglio si irraggiano raggi gamma."></canvas>
  <button class="rm-btn" id="rm-toggle" type="button">Pausa</button>
</div>
<script>
(function () {
  var cv = document.getElementById('rm-canvas');
  var ctx = cv.getContext('2d');
  var btn = document.getElementById('rm-toggle');

  // ---------- geometria ----------
  var W = 960, H = 640;          // spazio logico di disegno
  var CX = 480, YX = 320;        // punto X
  var SX = 1, SY = 1.7;            // anisotropia: lamina alta e sottile
  var Q  = 150;                  // scala delle linee di campo
  var R  = 2600, YS0 = 525;      // curvatura e quota della superficie stellare
  var NL = 6, PERIOD = 7.5;      // numero di linee e durata di un ciclo (s)

  var FAM = '"Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif';

  function ysurf(x) {
    var dx = x - CX, s = R * R - dx * dx;
    return YS0 + R - Math.sqrt(s > 0 ? s : 0);
  }

  // ---------- stelle di sfondo ----------
  var seed = 20041227;
  function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
  var stars = [];
  for (var i = 0; i < 190; i++) {
    var sx = rnd() * W, sy = rnd() * (H - 90);
    if (sy < ysurf(sx) - 14) stars.push({ x: sx, y: sy, r: rnd() * 1.1 + 0.25, a: rnd() * 0.45 + 0.18 });
  }

  // ---------- stato ----------
  var T = 0, playing = true, last = null;
  var flash = 0, crustHit = 0;
  var jets = [], photons = [];
  var prevP = new Array(NL).fill(1);
  var dpr = 1;

  function fit() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
  }
  fit();
  window.addEventListener('resize', fit);

  // p > 0 : linee in avvicinamento (regione di afflusso)
  // p < 0 : linee riconnesse (regione di deflusso)
  function pOf(i, t) {
    var u = ((t / PERIOD) + i / NL) % 1;
    if (u < 0) u += 1;
    if (u < 0.66) return 1.25 * (1 - u / 0.66);
    return -1.25 * Math.pow((u - 0.66) / 0.34, 0.55);
  }

  function branchPoints(p, s) {
    var q = Q * Math.abs(p), pts = [], TMAX = 4.2, N = 110;
    for (var i = 0; i <= N; i++) {
      var t = -TMAX + 2 * TMAX * i / N, x, y;
      if (p >= 0) { x = CX + s * SX * q * Math.cosh(t); y = YX + SY * q * Math.sinh(t); }
      else        { x = CX + SX * q * Math.sinh(t);     y = YX + s * SY * q * Math.cosh(t); }
      pts.push([x, y]);
    }
    return pts;
  }

  function strokeClipped(pts, color, width, alpha, glow) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
    ctx.beginPath();
    var pen = false;
    for (var i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1];
      var ok = (y <= ysurf(x) + 1) && y > -60 && y < H + 60 && x > -60 && x < W + 60;
      if (!ok) { pen = false; continue; }
      if (!pen) { ctx.moveTo(x, y); pen = true; } else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();
  }

  function mix(a, b, k) {
    return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * k) + ',' +
                    Math.round(a[1] + (b[1] - a[1]) * k) + ',' +
                    Math.round(a[2] + (b[2] - a[2]) * k) + ')';
  }

  function burst() {
    flash = 1;
    for (var i = 0; i < 30; i++) {
      var d = Math.random() < 0.5 ? -1 : 1;
      jets.push({
        x: CX + (Math.random() - 0.5) * 12,
        y: YX + d * (6 + Math.random() * 10),
        vx: (Math.random() - 0.5) * 0.6,
        vy: d * (2.0 + Math.random() * 3.4),
        life: 1
      });
    }
    for (var j = 0; j < 18; j++) {
      photons.push({ a: Math.random() * Math.PI * 2, r: 8, sp: 3.2 + Math.random() * 3.4, life: 1 });
    }
  }

  function step(dt) {
    T += dt;
    var k = dt * 60;
    flash *= Math.pow(0.90, k);
    crustHit *= Math.pow(0.93, k);

    for (var i = 0; i < NL; i++) {
      var p = pOf(i, T);
      if (prevP[i] > 0 && p <= 0) burst();
      prevP[i] = p;
    }

    for (var a = jets.length - 1; a >= 0; a--) {
      var jt = jets[a];
      jt.x += jt.vx * k; jt.y += jt.vy * k;
      jt.vy *= Math.pow(1.012, k);
      jt.life -= dt * 0.75;
      if (jt.y > ysurf(jt.x)) { crustHit = Math.min(1, crustHit + 0.28); jets.splice(a, 1); continue; }
      if (jt.life <= 0 || jt.y < -40) jets.splice(a, 1);
    }
    for (var b = photons.length - 1; b >= 0; b--) {
      var ph = photons[b];
      ph.r += ph.sp * k;
      ph.life -= dt * 0.95;
      if (ph.life <= 0 || ph.r > 620) photons.splice(b, 1);
    }
  }

  // ---------- etichette ----------
  function label(text, x, y, color, align, size, weight) {
    ctx.font = (weight || '600') + ' ' + (size || 14) + 'px ' + FAM;
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(5,3,11,0.88)';
    ctx.lineWidth = 4.5;
    ctx.strokeText(text, x, y);
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  }

  function leader(x1, y1, x2, y2, color) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // sfondo
    var bg = ctx.createRadialGradient(CX, YX, 30, CX, YX, 720);
    bg.addColorStop(0, '#150c2b');
    bg.addColorStop(0.55, '#0a0618');
    bg.addColorStop(1, '#04030a');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    for (var s = 0; s < stars.length; s++) {
      var st = stars[s];
      ctx.globalAlpha = st.a;
      ctx.fillStyle = '#cfd8ff';
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 6.284); ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.globalCompositeOperation = 'lighter';

    // linee di campo
    for (var i = 0; i < NL; i++) {
      var p = pOf(i, T);
      var white = Math.exp(-(p * p) / 0.010);
      var alpha = Math.max(0, Math.min(1, (1.25 - Math.abs(p)) / 0.32)) * 0.95;
      for (var si = 0; si < 2; si++) {
        var sg = si === 0 ? -1 : 1;
        var base = p >= 0 ? (sg < 0 ? [94, 200, 255] : [255, 122, 217]) : [255, 194, 92];
        var col = mix(base, [255, 255, 255], white * 0.85);
        var pts = branchPoints(p, sg);
        strokeClipped(pts, col, 5.5, alpha * 0.20, 16);
        strokeClipped(pts, col, 1.9, alpha, 8);
      }
    }

    // lamina di corrente
    var sheetA = 0.30 + 0.55 * flash;
    var gs = ctx.createLinearGradient(0, YX - 150, 0, YX + 150);
    gs.addColorStop(0, 'rgba(180,205,255,0)');
    gs.addColorStop(0.5, 'rgba(215,232,255,' + sheetA.toFixed(3) + ')');
    gs.addColorStop(1, 'rgba(180,205,255,0)');
    ctx.fillStyle = gs;
    ctx.fillRect(CX - 1.6, YX - 150, 3.2, 300);
    ctx.fillStyle = gs;
    ctx.globalAlpha = 0.18;
    ctx.fillRect(CX - 7, YX - 150, 14, 300);
    ctx.globalAlpha = 1;

    // bagliore del punto X
    if (flash > 0.01) {
      var gf = ctx.createRadialGradient(CX, YX, 0, CX, YX, 130 * (0.5 + flash));
      gf.addColorStop(0, 'rgba(255,255,255,' + (0.85 * flash).toFixed(3) + ')');
      gf.addColorStop(0.35, 'rgba(255,214,150,' + (0.35 * flash).toFixed(3) + ')');
      gf.addColorStop(1, 'rgba(255,180,90,0)');
      ctx.fillStyle = gf;
      ctx.beginPath(); ctx.arc(CX, YX, 130 * (0.5 + flash), 0, 6.284); ctx.fill();
    }

    // fotoni gamma
    ctx.lineWidth = 1.6;
    ctx.lineCap = 'round';
    for (var q2 = 0; q2 < photons.length; q2++) {
      var ph = photons[q2];
      var c = Math.cos(ph.a), sn = Math.sin(ph.a);
      var px = -sn, py = c;
      var hx = CX + c * ph.r, hy = YX + sn * ph.r;
      if (hy > ysurf(hx)) continue;
      ctx.strokeStyle = 'rgba(226,212,255,' + (0.85 * Math.max(0, ph.life)).toFixed(3) + ')';
      ctx.beginPath();
      for (var g2 = 0; g2 <= 5; g2++) {
        var u = g2 / 5, d = ph.r + (u - 0.5) * 15;
        var off = Math.sin(u * Math.PI * 2) * 3.2;
        var xx = CX + c * d + px * off, yy = YX + sn * d + py * off;
        if (g2 === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
      }
      ctx.stroke();
    }

    // getti di plasma
    for (var j2 = 0; j2 < jets.length; j2++) {
      var jt = jets[j2];
      var al = Math.max(0, Math.min(1, jt.life));
      ctx.strokeStyle = 'rgba(255,226,170,' + (0.75 * al).toFixed(3) + ')';
      ctx.lineWidth = 1.7;
      ctx.beginPath();
      ctx.moveTo(jt.x - jt.vx * 3, jt.y - jt.vy * 3);
      ctx.lineTo(jt.x, jt.y);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,247,225,' + (0.9 * al).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(jt.x, jt.y, 1.7, 0, 6.284); ctx.fill();
    }

    ctx.globalCompositeOperation = 'source-over';

    // ---------- superficie della magnetar ----------
    ctx.beginPath();
    ctx.moveTo(-6, H + 6);
    ctx.lineTo(-6, ysurf(-6));
    for (var x2 = 0; x2 <= W; x2 += 6) ctx.lineTo(x2, ysurf(x2));
    ctx.lineTo(W + 6, ysurf(W + 6));
    ctx.lineTo(W + 6, H + 6);
    ctx.closePath();
    var gc = ctx.createLinearGradient(0, YS0 - 6, 0, H);
    gc.addColorStop(0.00, '#ffe6bd');
    gc.addColorStop(0.13, '#ffab52');
    gc.addColorStop(0.45, '#c2551a');
    gc.addColorStop(1.00, '#3a1105');
    ctx.fillStyle = gc;
    ctx.fill();

    // bordo incandescente
    ctx.save();
    ctx.beginPath();
    for (var x3 = -6; x3 <= W + 6; x3 += 6) {
      if (x3 === -6) ctx.moveTo(x3, ysurf(x3)); else ctx.lineTo(x3, ysurf(x3));
    }
    ctx.strokeStyle = 'rgba(255,242,214,' + (0.8 + 0.2 * crustHit).toFixed(3) + ')';
    ctx.lineWidth = 2;
    ctx.shadowColor = 'rgba(255,180,100,0.95)';
    ctx.shadowBlur = 16 + 46 * crustHit;
    ctx.stroke();
    ctx.restore();

    // ---------- etichette ----------
    // legenda
    var lx = 22, ly = 30;
    var leg = [
      ['rgb(94,200,255)',  'campo diretto verso l’alto'],
      ['rgb(255,122,217)', 'campo diretto verso il basso'],
      ['rgb(255,194,92)',  'linee appena riconnesse']
    ];
    for (var L = 0; L < leg.length; L++) {
      ctx.fillStyle = leg[L][0];
      ctx.beginPath(); ctx.arc(lx + 4, ly + L * 21, 4, 0, 6.284); ctx.fill();
      label(leg[L][1], lx + 16, ly + L * 21, 'rgba(226,232,255,0.92)', 'left', 13, '500');
    }

    leader(CX - 74, 172, CX - 10, 205, '#cfe0ff');
    label('lamina di corrente', CX - 80, 172, '#dbe6ff', 'right', 14);

    leader(CX + 52, YX + 2, CX + 10, YX, '#ffffff');
    label('punto X', CX + 58, YX + 2, '#ffffff', 'left', 14);

    leader(CX + 52, 86, CX + 10, 112, '#ffd28a');
    label('getto di plasma relativistico', CX + 58, 86, '#ffd28a', 'left', 14);

    leader(742, 206, 664, 258, '#e2d4ff');
    label('raggi gamma', 748, 200, '#e6dbff', 'left', 14);

    // etichetta della superficie: testo scuro con alone chiaro, ben leggibile sulla crosta
    var slx = 212, sly = ysurf(slx) + 30;
    ctx.font = '700 15px ' + FAM;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(255,232,193,0.72)';
    ctx.lineWidth = 4;
    ctx.strokeText('superficie della magnetar', slx, sly);
    ctx.fillStyle = '#3a1002';
    ctx.fillText('superficie della magnetar', slx, sly);
  }

  function frame(ts) {
    if (last === null) last = ts;
    var dt = Math.min(0.05, (ts - last) / 1000);
    last = ts;
    if (playing) step(dt);
    draw();
    requestAnimationFrame(frame);
  }

  btn.addEventListener('click', function () {
    playing = !playing;
    btn.textContent = playing ? 'Pausa' : 'Riproduci';
  });

  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    playing = false;
    btn.textContent = 'Riproduci';
    T = 2.4;
  }

  if ('IntersectionObserver' in window) {
    var wasPlaying = playing;
    new IntersectionObserver(function (es) {
      for (var e = 0; e < es.length; e++) {
        if (!es[e].isIntersecting) { wasPlaying = playing; playing = false; }
        else if (wasPlaying) { playing = true; }
        btn.textContent = playing ? 'Pausa' : 'Riproduci';
      }
    }, { threshold: 0.05 }).observe(cv);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
