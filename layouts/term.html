{{ define "main" }}
<article class="markdown book-post">
  <ul class="book-tag-index">
  {{ range .Pages.ByTitle }}
    <li>
      <a href="{{ .RelPermalink }}">{{ partial "docs/title" . }}</a>{{ with .Params.subtitle }} — {{ . }}{{ end }}
    </li>
  {{ end }}
  </ul>
</article>
{{ end }}

{{ define "toc-container" }}
<aside class="book-toc">
  <div class="book-toc-content">
    {{ template "toc" . }}
  </div>
</aside>
{{ end }}

{{ define "toc" }}
  {{ partial "docs/taxonomy" . }}
{{ end }}
