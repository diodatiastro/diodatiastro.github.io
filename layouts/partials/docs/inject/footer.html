<div class="back-to-top">
  <a href="#" aria-label="Torna all'inizio della pagina">
    <span aria-hidden="true">↑</span> Inizio pagina
  </a>
</div>

<footer class="site-footer">
  <p>
    © {{ now.Format "2006" }}
    {{ with site.GetPage "/autore" }}<a href="{{ .RelPermalink }}">Michele Diodati</a>{{ else }}Michele Diodati{{ end }}.
    Tutti i diritti riservati.
  </p>
</footer>

<script>
(function () {
  function slugify(text) {
    return text
      .toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/(^-|-$)/g, '');
  }

  // Inserisce newLi in ul, subito prima del primo <li> "nativo"
  // (generato da Hugo per un titolo reale). Se non ce n'è, lo
  // aggiunge in fondo. Preserva l'ordine tra più box consecutivi
  // che finiscono nella stessa sotto-lista.
  function insertBoxEntry(ul, newLi) {
    var nativeSibling = null;
    for (var i = 0; i < ul.children.length; i++) {
      if (!ul.children[i].classList.contains('toc-box-entry')) {
        nativeSibling = ul.children[i];
        break;
      }
    }
    ul.insertBefore(newLi, nativeSibling);
  }

  function run() {
    var toc = document.querySelector('.book-toc');
    if (!toc) return;

    // Nelle pagine senza titoli di paragrafo il sommario di Hugo è vuoto:
    // si crea l'elenco, così i box (es. la "Definizione") vi entrano lo stesso
    var tocList = toc.querySelector('ul');
    if (!tocList) {
      var navToc = toc.querySelector('nav');
      if (!navToc) return;
      tocList = document.createElement('ul');
      navToc.appendChild(tocList);
    }

    var content = document.querySelector('.book-page .markdown');
    if (!content) return;

    var headingLis = {};
    tocList.querySelectorAll('a[href^="#"]').forEach(function (a) {
      headingLis[a.getAttribute('href').slice(1)] = a.closest('li');
    });

    var usedIds = {};

    content.querySelectorAll('.info-box').forEach(function (box) {
      var label = box.querySelector('.info-box__label');
      var testo = label ? label.textContent.trim() : 'Approfondimento';
      var tipoMatch = box.className.match(/info-box--(\S+)/);
      var tipo = tipoMatch ? tipoMatch[1] : 'approfondimento';

      // Quali box entrano nel menu dei paragrafi:
      // 1. menu="no" nello shortcode lo nasconde sempre, anche all'inizio della pagina;
      // 2. menu="sì" lo mostra sempre;
      // 3. senza il parametro: i box all'inizio della pagina, prima di qualsiasi
      //    titolo, compaiono sempre (riassumono l'argomento: "Il Sole in breve" e
      //    simili); più avanti restano fuori solo i box "L'argomento in breve" di
      //    tipo approfondimento (azzurri), che stanno subito sotto il titolo che
      //    riassumono; tutti gli altri entrano.
      var scelta = box.getAttribute('data-menu');
      if (scelta === 'no') return;
      if (scelta !== 'si') {
        var primoTitolo = content.querySelector('h1[id], h2[id], h3[id], h4[id], h5[id], h6[id]');
        var inTesta = !primoTitolo || (box.compareDocumentPosition(primoTitolo) & Node.DOCUMENT_POSITION_FOLLOWING);
        if (!inTesta && tipo !== 'definizione' &&
            testo.toLowerCase().replace(/\u2019/g, "'") === "l'argomento in breve") return;
      }

      // L'id è ormai generato lato server da box.html (via anchorize),
      // stabile e utilizzabile anche da link esterni alla pagina.
      // Il fallback qui sotto copre solo box senza id (caso non
      // dovrebbe più verificarsi dopo la modifica a box.html).
      var id = box.id;
      if (!id) {
        var baseId = 'box-' + slugify(testo);
        id = baseId;
        var i = 1;
        while (usedIds[id] || document.getElementById(id)) {
          id = baseId + '-' + (++i);
        }
        box.id = id;
      }
      usedIds[id] = true;

      // titolo di qualsiasi livello (H2-H6) che precede il box
      var heading = null, el = box;
      while (el && !heading) {
        el = el.previousElementSibling;
        if (el && /^H[1-6]$/.test(el.tagName) && el.id) heading = el;
      }

      var newLi = document.createElement('li');
      newLi.className = 'toc-box-entry toc-box-entry--' + tipo;
      var newA = document.createElement('a');
      newA.href = '#' + id;
      newA.textContent = testo;
      newLi.appendChild(newA);

      if (heading && headingLis[heading.id]) {
        var parentLi = headingLis[heading.id];
        var subUl = parentLi.querySelector(':scope > ul');
        if (!subUl) {
          subUl = document.createElement('ul');
          parentLi.appendChild(subUl);
        }
        insertBoxEntry(subUl, newLi);
      } else {
        insertBoxEntry(tocList, newLi);
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', run);
  } else {
    run();
  }
})();
</script>
