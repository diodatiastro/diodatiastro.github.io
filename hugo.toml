baseURL = 'https://diodatiastro.github.io/'
locale = 'it-it'
defaultContentLanguage = 'it'
title = 'Le stelle più affascinanti del cielo'

theme = 'hugo-book'

[taxonomies]
  tag = 'tags'

[params]
  BookTheme = 'dark'
  BookLogo = 'logo.svg'
  BookSection = '*'
  math = true
  walineServer = 'https://diodatiastro-commenti.vercel.app'
  # Data degli articoli all'italiana (es. 12 agosto 2026): :date_long segue la lingua del sito
  BookDateFormat = ':date_long'

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true

        [markup.goldmark.extensions.passthrough.delimiters]
          block = [
            ["$$", "$$"]
          ]
          inline = [
            ["$", "$"]
          ]

        [markup.goldmark.renderer]
          unsafe = true