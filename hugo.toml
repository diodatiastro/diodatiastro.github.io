baseURL = 'https://diodatiastro.github.io/'
locale = 'it-it'
defaultContentLanguage = 'it'
title = 'Le stelle più affascinanti del cielo'

theme = 'hugo-book'

# Versione inglese del sito (in preparazione).
# Le traduzioni stanno accanto agli originali, nella stessa cartella:
# index.md (italiano) e index.en.md (inglese); immagini e figure restano in comune.
# Online la versione inglese è disattivata qui sotto (disableLanguages), quindi
# la build di GitHub (ambiente "production") pubblica solo il sito italiano.
# Il server locale (hugo server, ambiente "development") la riattiva con
# config/development/hugo.toml: le pagine inglesi si vedono in locale su /en/.
# Per pubblicarla, quando le traduzioni saranno complete, basterà togliere 'en'
# da disableLanguages.
disableLanguages = ['en']

[languages]
  [languages.it]
    weight = 1
    locale = 'it-it'
    label = 'Italiano'
    title = 'Le stelle più affascinanti del cielo'
  [languages.en]
    weight = 2
    locale = 'en-us'
    label = 'English'
    title = 'The most fascinating stars in the sky'

[taxonomies]
  tag = 'tags'

[params]
  BookTheme = 'dark'
  BookLogo = 'logo.svg'
  BookSection = '*'
  math = true
  walineServer = 'https://diodatiastro-commenti.vercel.app'
  # Data degli articoli all'italiana (es. 12 agosto 2026): :date_long segue la lingua del sito
  BookDateFormat = ':date_long'
  # Iscrizione agli avvisi via email (follow.it): indirizzo "action" del modulo,
  # copiato dal codice del modulo d'iscrizione nel pannello di follow.it.
  # Finché è vuoto, il riquadro d'iscrizione non compare da nessuna parte.
  iscrizioneAzione = 'https://api.follow.it/subscription-form/U2U1dDhNTVA0aWoxQk83Z2JGRzBDSFNFR0pxRHpvc2RlSmM0cTNkcng2SWQybGkydS9TVmZ5MHpOS2Z2RVZUSGk4YkJHSWlKWE90R0NDUnFxYnVrSzVJL1ZMcEY2R29pcEtSVzVHNFNOR3hFWGRzUnV4ZEpNZWtHTVdZbkdIZkN8cS9nYWlPMnZwbS9PNmNWTGlwdnppaHE1NXZ3aXcvekdLcHdrRjVUQlo3MD0=/8'

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true

        [markup.goldmark.extensions.passthrough.delimiters]
          block = [
            ["$$", "$$"]
          ]
          inline = [
            ["$", "$"]
          ]

        [markup.goldmark.renderer]
          unsafe = true

# Feed degli avvisi per follow.it (https://diodatiastro.github.io/avvisi.xml):
# solo articoli del catalogo (un saggio conta come un solo articolo) e voci del
# dizionario, ciascuno con titolo, sottotitolo (o prima frase della definizione) e link.
# Il modello è in layouts/home.avvisi.xml.
[outputFormats]
  [outputFormats.avvisi]
    mediaType = 'application/rss+xml'
    baseName = 'avvisi'
    rel = 'alternate'

[outputs]
  home = ['html', 'rss', 'avvisi']
